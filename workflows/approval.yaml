version: 1
workflow:
  image: registry.reactis.cloud/infrabot:1.0
  imagePullSecrets:
    - name: registry
  workingDir: "[%RUN_DIR%]"
  timeoutSeconds: 300
  ttlSecondsAfterFinished: 300
  envFiles:
    - /root/.config/agentis/agentis.env
  env:
    IS_SANDBOX: 1
  mounts:
    - name: approval-run
      mountPath: "[%RUN_DIR%]"
      hostPath:
        path: "[%RUN_DIR%]"
        type: Directory
  steps:
    - name: Review command
      run: |
        sleep 1
        echo 1 > "$AGENTIS_RUN_DIR/approved.data"
        printf '%s\n' '{"score": 1.0}' > "$AGENTIS_RUN_DIR/approved-metadata.json"
      outputs:
        - type: var
          name: APPROVED
          valueFrom: approved.data
        - type: var
          name: APPROVED_METADATA
          valueFrom: approved-metadata.json
