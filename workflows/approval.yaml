version: 1
workflow:
  image: registry.reactis.cloud/infrabot:1.0
  imagePullSecrets:
    - name: registry
  workingDir: "[%RUN_DIR%]"
  timeoutSeconds: 300
  ttlSecondsAfterFinished: 300
  envFiles:
    - /root/.config/agentis/agentis.env
    - /root/.config/agentis/jev.env
  env:
    IS_SANDBOX: 1
  mounts:
    - name: approval-run
      mountPath: "[%RUN_DIR%]"
      hostPath:
        path: "[%RUN_DIR%]"
        type: Directory
  steps:
    - name: Review command
      run: |
        echo 1 > "$AGENTIS_RUN_DIR/approved.data"
      outputs:
        - type: var
          name: APPROVED
          valueFrom: approved.data
